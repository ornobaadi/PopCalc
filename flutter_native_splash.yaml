# PopCalc launch splash: bridges the cold-start gap until Flutter draws its
# first frame, where SplashScreen takes over from the very same picture.
# No image on purpose: Android 12+ then draws the icon of the launcher entry
# the user tapped, i.e. their chosen app icon (each icon is its own
# <activity-alias>), in a 160 dp circle on this colour. SplashScreen's first
# frame matches that exactly. Older Android shows just the colour.
# Apply changes with: dart run flutter_native_splash:create
flutter_native_splash:
  # Follows the device's light/dark setting, not the in-app skin.
  color: "#FFAE00"
  color_dark: "#141414"
  android_12:
    color: "#FFAE00"
    color_dark: "#141414"
